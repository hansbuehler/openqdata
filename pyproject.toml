[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openqdata"
version = "0.2.0"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Hans Buehler"}]
readme = "README.md"
description = "Systematic access to cached quantitative market data"
requires-python = ">=3.12,<3.15"
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "cdxcore>=0.1.97", "numpy>=1.26", "scipy>=1.12", "pandas>=2.2; python_version < '3.14'", "pandas>=2.3.3; python_version >= '3.14'", "polars>=1",
  "pyarrow", "requests", "urllib3", "prettytable", "click>=8", "pandas-market-calendars>=4.4",
  "cvxpy", "highspy", "h5py", "sortedcontainers",
  "wrds>=3.2; python_version < '3.14'", "sqlalchemy>=2,<2.1; python_version < '3.14'", "sqlalchemy>=2; python_version >= '3.14'", "psycopg2-binary>=2.9,<2.10", "massive>=2.5", "yfinance>=1.3",
]

[project.urls]
Repository = "https://github.com/hansbuehler/openqdata"

[project.optional-dependencies]
jax = ["jax"]
test = ["pytest>=8.2", "ruff", "build"]
docs = ["sphinx>=8", "myst-parser"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["openqdata*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--import-mode=importlib"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["I"]
